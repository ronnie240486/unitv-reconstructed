name: Prestigie - gerar APK

# Gera o APK do Prestigie (release, assinado com uma chave de teste guardada em cache).
# Roda sozinho quando arquivos do app são enviados ao repositório, ou à mão: Actions > "Prestigie - gerar APK" > Run workflow.
# O APK sai em Actions > (execução) > Artifacts > Prestigie-apk.
# Se o app já estava instalado com outra assinatura, desinstale antes de instalar este.
on:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  workflow_dispatch:

concurrency:
  group: prestigie-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Chave de assinatura (guardada em cache entre execuções)
        uses: actions/cache@v4
        with:
          path: prestigie.keystore
          key: prestigie-keystore-v1

      - name: Criar a chave se ainda não existir
        run: |
          if [ ! -f prestigie.keystore ]; then
            keytool -genkeypair -v -keystore prestigie.keystore -storepass prestigie-test-key -keypass prestigie-test-key \
              -alias prestigie -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Prestigie Test"
          fi

      - name: Gerar e assinar o APK
        run: |
          exec > >(tee /tmp/build.log) 2>&1
          trap 'rc=$?; sleep 1; if [ $rc -ne 0 ]; then ERR=$( (grep -E "^e: |error:|What went wrong|Execution failed|FAILED|Unresolved|Exception" /tmp/build.log | head -12; echo "--- fim do log ---"; tail -n 6 /tmp/build.log) | cut -c1-260 | sed "s/%/%25/g" | paste -sd "|" -); echo "::error title=Falhou::$ERR"; fi' EXIT
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvm.options="-Xmx2g" \
            :app:assembleRelease

          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK sem assinatura: $UNSIGNED"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks prestigie.keystore --ks-key-alias prestigie \
            --ks-pass pass:prestigie-test-key --key-pass pass:prestigie-test-key \
            --out Prestigie.apk aligned.apk
          "$BT/apksigner" verify --verbose Prestigie.apk
          sha256sum Prestigie.apk

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: Prestigie-apk
          path: Prestigie.apk
